<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>購物車</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🛒 我的購物車</h1>
    <div>
      <a href="index.html">回商城</a>
      <a href="weekly-menu.html">本週菜單</a>
      <span id="memberArea"></span>
      <span class="cart-icon" onclick="window.location.href='cart.html'">
        🛒
        <span id="cart-count" class="cart-badge"></span>
      </span>
    </div>
  </header>

  <main>
    <section class="cart-batch-panel" id="batchCartPanel">
      <div class="cart-batch-panel__head">
        <div>
          <h2>批次加入購物車</h2>
          <p>可貼上手寫單辨識後的文字，例如：肉魚 6kg、豆芽菜 46kg。系統會依原始文字自動篩出相近商品，隱藏不相干選項，確認後才加入購物車。</p>
        </div>
        <button type="button" class="cart-batch-toggle" id="batchCartToggle">開啟批次加入</button>
      </div>
      <div class="cart-batch-panel__body" id="batchCartBody" hidden>
        <textarea id="batchCartText" class="cart-batch-textarea" rows="7" placeholder="每行一個品項，例如：
肉魚 6kg
苦菜 3kg
豆芽菜 46kg
山東白 60kg
白蘿蔔 8kg"></textarea>
        <div class="cart-batch-actions">
          <button type="button" id="batchCartAnalyze" class="cart-batch-primary">解析並比對商品</button>
          <button type="button" id="batchCartClear" class="cart-batch-secondary">清空文字</button>
        </div>
        <div id="batchCartStatus" class="cart-batch-status" hidden></div>
        <div id="batchCartPreview" class="cart-batch-preview" hidden></div>
      </div>
    </section>

    <div id="cart-list"></div>
    <p id="cart-total"></p>
    <a href="checkout.html" id="checkout-btn" class="cart-btn">前往結帳</a>
  </main>

  <footer>
    <p>© 2025 農業共同採購平台</p>
  </footer>

  <script src="config.js"></script>
  <script src="member.shop.js"></script>
  <script src="cart-utils.js"></script>
  <script src="cart-batch.js"></script>
  <script>
    function renderCart() {
      const container = document.getElementById("cart-list");
      const cart = getCart() || [];
      container.innerHTML = "";

      if (!cart.length) {
        container.innerHTML = "<p>購物車是空的</p>";
        document.getElementById("cart-total").textContent = "";
        document.getElementById("checkout-btn").style.display = "none";
        return;
      }

      cart.forEach(item => {
        const div = document.createElement("div");
        div.className = "cart-item cart-item-editable";

        const name = document.createElement("span");
        name.className = "cart-item-name";
        name.textContent = item.name || "";

        const qtyWrap = document.createElement("div");
        qtyWrap.className = "cart-qty-control";
        const qtyLabel = document.createElement("span");
        qtyLabel.className = "cart-qty-label";
        qtyLabel.textContent = "數量";
        const qtyInput = document.createElement("input");
        qtyInput.type = "number";
        qtyInput.min = "1";
        qtyInput.step = "0.01";
        qtyInput.value = typeof formatCartQty === "function" ? formatCartQty(item.qty) : normalizeCartQty(item.qty);
        qtyInput.setAttribute("aria-label", `${item.name || "商品"} 數量`);
        qtyInput.addEventListener("change", () => updateCartItemQty(item.id, qtyInput.value));
        qtyInput.addEventListener("blur", () => updateCartItemQty(item.id, qtyInput.value));
        qtyInput.addEventListener("keydown", ev => {
          if (ev.key === "Enter") {
            ev.preventDefault();
            updateCartItemQty(item.id, qtyInput.value);
            qtyInput.blur();
          }
        });
        qtyWrap.appendChild(qtyLabel);
        qtyWrap.appendChild(qtyInput);

        const subtotal = document.createElement("span");
        subtotal.className = "cart-item-subtotal";
        const subtotalValue = Number(item.price || 0) * normalizeCartQty(item.qty);
        subtotal.textContent = `小計: $${typeof formatCartMoney === "function" ? formatCartMoney(subtotalValue) : subtotalValue}`;
        
        const btn = document.createElement("button");
        btn.textContent = "刪除";
        btn.addEventListener("click", () => removeCartItem(item.id));

        div.appendChild(name);
        div.appendChild(qtyWrap);
        div.appendChild(subtotal);
        div.appendChild(btn);
        container.appendChild(div);
      });

      const total = cart.reduce((sum,i)=>sum+Number(i.price || 0)*normalizeCartQty(i.qty),0);
      document.getElementById("cart-total").textContent = `總計: $${typeof formatCartMoney === "function" ? formatCartMoney(total) : total}`;
      document.getElementById("checkout-btn").style.display = "inline-block";
    }

    function removeCartItem(id) {
      let cart = getCart() || [];
      cart = cart.filter(i => i.id !== id);
      setCart(cart);
      updateCartCount();
      renderCart();
    }

    document.addEventListener("DOMContentLoaded", () => {
      updateMemberArea();
      updateCartCount();
      renderCart();
      if (typeof initBatchCartTools === "function") initBatchCartTools();
    });
  </script>
  <script src="weekly-menu.js"></script>
</body>
</html>
